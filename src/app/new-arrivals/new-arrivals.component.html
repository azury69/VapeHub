<div class="p-5 bg-gray-100" style="background-image: url(/abstract-background-brown-smoke-texture-cinematic-design.jpg)
">
    <h2 class="text-2xl font-bold text-center mb-6">New<span class="text-pink-400">Arrivals</span></h2>
    <div class="flex flex-wrap justify-center gap-6">
      <div *ngFor="let product of products" class="bg-white shadow-lg rounded-lg p-4 w-64">
        <img [src]="product.image" alt="{{ product.title }}" class="rounded-lg h-40 w-full object-cover">
        <h3 class="mt-2 font-extrabold hover:text-pink-400">{{ product.title }}</h3>
        <p class=" font-semibold text-cyan-400 drop-shadow-md">{{ product.price }}</p>
      </div>
    </div>
  </div>
